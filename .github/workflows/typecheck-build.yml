name: Typecheck and Cloudflare Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Cloudflare types
        run: npm run cloudflare:types

      - name: Typecheck all workspaces and services
        run: npm run typecheck

      - name: Validate catalog and smoke checks
        run: npm run validate && npm run smoke

      - name: Build Cloudflare web bundle
        run: npm run build:cloudflare
